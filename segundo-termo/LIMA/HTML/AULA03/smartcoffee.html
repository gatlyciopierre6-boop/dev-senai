<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCoffee - Galeria</title>
    <style>
        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f2;
            color: #3e2723;
            margin: 0;
            padding: 0;
        }

        /* Cabeçalho */
        header {
            background-color: #3e2723;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            margin: 10px 0 0 0;
            font-style: italic;
            opacity: 0.8;
        }

        /* Banner de Destaque */
        .banner-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            text-align: center;
        }

        .banner-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Seção da Galeria */
        .gallery-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .gallery-title {
            border-bottom: 2px solid #d7ccc8;
            padding-bottom: 10px;
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        /* Grade de Fotos (Grid) */
        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Cartão de Foto */
        .photo-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: translateY(-5px);
        }

        .photo-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        /* Rodapé */
        footer {
            background-color: #211512;
            color: #d7ccc8;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Topo do Site -->
    <header>
        <h1>SmartCoffee</h1>
        <p>A experiência do café perfeito em cada detalhe</p>
    </header>

    <!-- Banner Horizontal (transferir.png) -->
    <div class="banner-container">
        <img class="banner-img" src="projeto/transferir.jpg" alt="SmartCoffee Banner">
    </div>

    <!-- Galeria de Imagens -->
    <main class="gallery-container">
        <h2 class="gallery-title">Nossa Coleção</h2>
        
        <div class="grid-gallery">
            
            <!-- Foto 1 -->
            <div class="photo-card">
                <img src="projeto/image_62e02735.png" alt="Café SmartCoffee">
            </div>

            <!-- Foto 2 -->
            <div class="photo-card">
                <img src="projeto/premium_photo-1673545518720-1228e52894e2.avif" alt="Xícara de Cappuccino">
            </div>

            <!-- Foto 3 -->
            <div class="photo-card">
                <img src="projeto/premium_photo-1675435644687-562e8042b9db.avif" alt="Grãos de Café e Xícara">
            </div>

            <!-- Foto 4 -->
            <div class="photo-card">
                <img src="projeto/premium_photo-1681711648620-9fa368907a86.avif" alt="Copo de Café para Viagem">
            </div>

            <!-- Foto 5 -->
            <div class="photo-card">
                <img src="projeto/premium_photo-1723741242126-160dba55b6d3.avif" alt="Espresso Perfeito">
            </div>

            <!-- Foto 6 -->
            <div class="photo-card">
                <img src="projeto/premium_photo-1777047934161-430271ff18f8.avif" alt="Café entre Flores">
            </div>

        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 SmartCoffee. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
