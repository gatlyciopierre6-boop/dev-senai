<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Interativa - Web</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header class="header">
            <h1>Calculadora</h1>
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Calculadora -->
        <div class="calculator">
            <!-- Display com expressão e resultado -->
            <div class="display">
                <div class="expression" id="expression"></div>
                <input type="text" id="display" class="display-input" readonly placeholder="0">
            </div>

            <!-- Botões -->
            <div class="buttons">
                <!-- Linha 1: Funções avançadas -->
                <button class="btn btn-function" onclick="percentage()">%</button>
                <button class="btn btn-function" onclick="squareRoot()">√</button>
                <button class="btn btn-function" onclick="appendOperator('**')">x²</button>
                <button class="btn btn-function btn-danger" onclick="clearDisplay()">C</button>

                <!-- Linha 2 -->
                <button class="btn btn-number" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

                <!-- Linha 3 -->
                <button class="btn btn-number" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

                <!-- Linha 4 -->
                <button class="btn btn-number" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

                <!-- Linha 5 -->
                <button class="btn btn-number" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" onclick="appendNumber('.')">.</button>
                <button class="btn btn-function" onclick="deleteLastChar()">⌫</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

                <!-- Linha 6 -->
                <button class="btn btn-equals" onclick="calculate()">=</button>
            </div>
        </div>

        <!-- Histórico -->
        <div class="history-section">
            <div class="history-header">
                <h3>📋 Histórico</h3>
                <button class="btn-clear-history" onclick="clearHistory()" id="clearHistoryBtn" style="display:none;">Limpar</button>
            </div>
            <div class="history-list" id="historyList">
                <p class="history-empty">Nenhum cálculo realizado ainda</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
